<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 1</title>
</head>
<body>
    <h1 id="judul">Aku belum berubah</h1>
    <button id="btnubah">Ubah Teks</button>
    <button id="btnwarna">Ubah warna</button>
    <button id="resize">Ubah Ukuran</button>
    <button id="reset">Reset teks</button>

    <script>
        const judul = document.getElementById('judul');
        const btnubah = document.getElementById('btnubah');
        const btnwarna = document.getElementById('btnwarna');
        const btnresize = document.getElementById('resize');
        const btnreset = document.getElementById('reset');

        btnubah.addEventListener('click', function() {
            judul.textContent = 'Aku sudah berubah';
        });

        btnwarna.addEventListener('click', function() {
            judul.style.color = 'red';
        });

        btnresize.addEventListener('click', function() {
            judul.style.fontSize = '50px';
        });

        btnreset.addEventListener('click', function() {
            judul.textContent = 'Aku belum berubah';
            judul.style.color = '';
            judul.style.fontSize = '';
        });
    </script>
</body>
</html>
